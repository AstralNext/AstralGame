[package]
name = "rust_lib_astral_game"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"

easytier = { git = "https://github.com/ldoubil/EasyTier.git", branch = "feat/upstream-merge", features = [
    "wireguard",
    "websocket",
    "quic",
    "tun",
    "smoltcp",
    "socks5",
    "kcp",
    "faketcp",
    "magic-dns",
    "zstd",
] }
easytier-core = { git = "https://github.com/ldoubil/EasyTier.git", branch = "feat/upstream-merge" }
async-trait = "0.1"
tracing = "0.1"
# 只是调用全局 logger 的 flush()（ET 的日志器实现了 log::Log）；
# 该 crate 本来就在依赖树里，不引入额外体积。
log = "0.4"

anyhow = "1"
base64 = "0.22"
lazy_static = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "signal", "net", "io-util"] }
tokio-util = "0.7"
socket2 = { version = "0.5", features = ["all"] }
local-ip-address = "0.6"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = "2"

[target.'cfg(target_os = "windows")'.dependencies]
steamworks = "0.13.1"
wintun = "0.5.1"
ipnetwork = "0.20"
windows = { version = "0.52.0", features = [
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Memory",
    "Win32_System_WindowsProgramming",
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_Rpc",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Console"
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# 本地补丁：上游 steamworks 0.13.1 没有暴露 SteamNetConnectionInfo_t.m_idPOPRelay，
# 无法判断 SDR 连接走中继还是直连；vendor 副本补了 relay_pop() / pop_remote()。
[patch.crates-io]
steamworks = { path = "vendor/steamworks" }

# 发行版瘦身：Rust 库是 Release 目录里最大的文件（默认配置下 30 MB+，大半是
# 符号表和未合并的泛型代码）。不做 panic=abort——flutter_rust_bridge 依赖
# 捕获 panic 转成 Dart 异常，abort 会让进程直接退出。
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
