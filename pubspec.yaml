name: astral_game
description: "Astral Game Client"
publish_to: 'none'

version: 1.1.7

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  astral_rust_core:
    git:
      url: https://github.com/AstralNext/astral_rust_core.git
      ref: 39cbe5b6d794b3949cc1d4f6f94451613eee385b
  vpn_service_plugin:
    git:
      url: https://github.com/AstralNext/vpn_service_plugin.git
      ref: 529771eb5b58704f5b03b88fc6c39e6307b05837
  crypto: ^3.0.7
  window_manager: ^0.4.3
  get_it: ^9.2.0
  signals: ^6.3.0
  signals_flutter: ^6.3.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.4
  app_links: ^6.4.1
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  package_info_plus: ^8.3.0
  image_picker: ^1.1.1
  file_picker: ^8.3.7
  http: ^1.2.2
  logger: ^2.0.0
  tray_manager: ^0.5.2
  device_info_plus: ^12.4.0
  connectivity_plus: ^7.1.1
  home_widget: ^0.7.0
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.7+1
  ffi: ^2.1.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/logo.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/logo.png
  windows:
    # Multi-size ICO is generated by tools/generate_app_icon.py (16–256).
    # flutter_launcher_icons only embeds a single 256px image, which looks jagged on the desktop.
    generate: false
  macos:
    generate: true
    image_path: assets/logo.png
  web:
    generate: true
    image_path: assets/logo.png
    background_color: "#000000"
    theme_color: "#000000"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon.ico
    - assets/games/
    - assets/games/ark/
    - assets/games/dont_starve_together/
    - assets/games/factorio/
    - assets/games/forged_alliance/
    - assets/games/left_4_dead/
    - assets/games/left_4_dead_2/
    - assets/games/mindustry/
    - assets/games/minecraft/
    - assets/games/palworld/
    - assets/games/payday_the_heist/
    - assets/games/project_zomboid/
    - assets/games/raft/
    - assets/games/rust/
    - assets/games/satisfactory/
    - assets/games/seven_days_to_die/
    - assets/games/stardew_valley/
    - assets/games/sudden_strike_II/
    - assets/games/terraria/
    - assets/games/v_rising/
    - assets/games/valheim/
    - assets/scenery/
