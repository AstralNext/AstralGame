name: astral_game
description: "Astral Game Client"
publish_to: 'none'

version: 1.0.5

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  astral_rust_core:
    git:
      url: https://github.com/AstralNext/astral_rust_core.git
      ref: main
  vpn_service_plugin:
    git:
      url: https://github.com/AstralNext/vpn_service_plugin.git
      ref: main
  pointycastle: ^3.9.1
  window_manager: ^0.4.3
  get_it: ^9.2.0
  signals: ^6.3.0
  signals_flutter: ^6.3.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  package_info_plus: ^8.3.0
  image_picker: ^1.1.1
  http: ^1.2.2
  logger: ^2.0.0
  tray_manager: ^0.5.2
  device_info_plus: ^12.4.0
  connectivity_plus: ^7.1.1
  home_widget: ^0.7.0
  firebase_core: ^4.9.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/logo.png
  adaptive_icon_background: "#C27803"
  adaptive_icon_foreground: assets/logo.png
  windows:
    generate: true
    image_path: assets/logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/logo.png
  web:
    generate: true
    image_path: assets/logo.png
    background_color: "#C27803"
    theme_color: "#C27803"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    # Windows tray icon
    - assets/icon.ico
    # Game covers (local assets; remote rules may use network URLs)
    - assets/games/minecraft/icon.png
    - assets/games/minecraft/grid.png
    - assets/games/terraria/icon.png
    - assets/games/terraria/grid.png
    - assets/games/valheim/icon.png
    - assets/games/valheim/grid.png
    - assets/games/palworld/icon.png
    - assets/games/palworld/grid.png
    # Offline generic fallback; full rules at https://astral.fan/gamerules.json
    - assets/games/rules.json
    - assets/scenery/daily.jpg
