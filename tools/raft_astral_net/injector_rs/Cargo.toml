[package]
name = "astral_mono_inject"
version = "0.1.0"
edition = "2021"
description = "Detect Unity/Mono processes and inject a C# assembly (SharpMonoInjector port)."

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Security",
] }
