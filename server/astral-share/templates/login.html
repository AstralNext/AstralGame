<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Astral Share · 登录</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #080a0f;
    --panel: #11151d;
    --panel-2: #161b25;
    --line: rgba(255, 255, 255, 0.08);
    --text: #e8ecf4;
    --muted: #8b96a8;
    --accent: #7c9cff;
    --accent-2: #6ee7b7;
    --danger: #ff7a85;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(900px 520px at 12% -10%, rgba(124, 156, 255, 0.16), transparent 60%),
      radial-gradient(760px 460px at 92% 110%, rgba(110, 231, 183, 0.12), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(400px, 100%);
    padding: 30px 28px 26px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55);
  }
  .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 26px; }
  .logo {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 13px;
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    color: #0a0c11;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: 0.2px; }
  .brand p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
  label { display: block; margin-bottom: 8px; font-size: 12.5px; color: var(--muted); letter-spacing: 0.3px; }
  .field { position: relative; }
  input {
    width: 100%;
    height: 46px;
    padding: 0 62px 0 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: rgba(0, 0, 0, 0.35);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  input::placeholder { color: #4d5666; }
  input:focus { border-color: rgba(124, 156, 255, 0.65); box-shadow: 0 0 0 3px rgba(124, 156, 255, 0.16); }
  .toggle {
    position: absolute;
    top: 50%; right: 6px;
    transform: translateY(-50%);
    height: 34px;
    padding: 0 11px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
  }
  .toggle:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
  .submit {
    width: 100%;
    height: 46px;
    margin-top: 18px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #9db4ff);
    color: #0a0c11;
    font-size: 14.5px;
    font-weight: 650;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .submit:hover { filter: brightness(1.06); }
  .submit:active { transform: scale(0.985); }
  .error {
    margin: 0 0 16px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255, 122, 133, 0.35);
    background: rgba(255, 122, 133, 0.1);
    color: var(--danger);
    font-size: 12.5px;
  }
  .hint { margin: 16px 0 0; font-size: 12px; line-height: 1.6; color: #616d80; text-align: center; }
</style>
</head>
<body>
  <form class="card" method="post" action="/admin/login" autocomplete="off">
    <div class="brand">
      <span class="logo">A</span>
      <div>
        <h1>Astral Share</h1>
        <p>短码服务 · 管理后台</p>
      </div>
    </div>
    {{if .Error}}<p class="error">管理员令牌不正确，请重试。</p>{{end}}
    <label for="token">管理员令牌</label>
    <div class="field">
      <input id="token" name="token" type="password" placeholder="输入 ASTRAL_SHARE_ADMIN_TOKEN" required autofocus>
      <button class="toggle" type="button" id="toggle">显示</button>
    </div>
    <button class="submit" type="submit">进入控制台</button>
    <p class="hint">令牌由服务器环境变量 ASTRAL_SHARE_ADMIN_TOKEN 配置</p>
  </form>
<script>
  (function () {
    var input = document.getElementById('token');
    var toggle = document.getElementById('toggle');
    toggle.addEventListener('click', function () {
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      toggle.textContent = show ? '隐藏' : '显示';
      input.focus();
    });
  })();
</script>
</body>
</html>
