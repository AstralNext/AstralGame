name: 🚀 Build Astral Game

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Select platform to build'
        required: true
        type: choice
        options:
          - all
          - android-arm64
          - linux-x64
          - windows-x64
        default: 'all'
  # 推送 v* 只编译产物；GitHub Release 须在 Actions 里手动跑「发布」。
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      - 'assets/**'
      - 'installer/**'
      - 'tools/raft_astral_net/**'
      - 'tools/valheim_astral_net/**'
      - 'tools/mono_inject/**'
      - 'tools/auto_dns_binder/**'
      - 'tools/smartdns/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'

# 同一 ref 连续 push 只保留最新一次，避免排队堆叠。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # job 级 if 不能使用 matrix；手动触发时在此按 inputs.platform 过滤矩阵。
  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SELECTED: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          # 必须保持单行 JSON；多行写入 GITHUB_OUTPUT 会触发 Invalid format。
          ALL=$(jq -nc '
            [
              {"platform":"android-arm64","os":"ubuntu-22.04","flutter_platform":"android","rust_target":"aarch64-linux-android","build_cmd":"flutter build apk --release --target-platform android-arm64","artifact_path":"build/app/outputs/flutter-apk/app-release.apk","artifact_name":"astral-game-android-arm64","package":false},
              {"platform":"linux-x64","os":"ubuntu-22.04","flutter_platform":"linux","rust_target":"x86_64-unknown-linux-gnu","build_cmd":"flutter build linux --release","artifact_path":"build/linux/x64/release/bundle","artifact_name":"astral-game-linux-x64","package":true},
              {"platform":"windows-x64","os":"windows-2022","flutter_platform":"windows","rust_target":"x86_64-pc-windows-msvc","build_cmd":"flutter build windows --release","artifact_path":"build/windows/x64/runner/Release","artifact_name":"astral-game-windows-x64","package":false}
            ]
          ')
          if [[ "$EVENT" == "workflow_dispatch" && "$SELECTED" != "all" ]]; then
            INCLUDE=$(echo "$ALL" | jq -c --arg p "$SELECTED" '[.[] | select(.platform == $p)]')
          else
            INCLUDE=$(echo "$ALL" | jq -c '.')
          fi
          if [[ "$INCLUDE" == "[]" ]]; then
            echo "::error::Unknown platform: $SELECTED"
            exit 1
          fi
          MATRIX=$(echo "$INCLUDE" | jq -c '{include: .}')
          {
            echo 'matrix<<MATRIX_EOF'
            echo "$MATRIX"
            echo 'MATRIX_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    name: 🏗️ ${{ matrix.platform }}
    needs: matrix-prep
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-prep.outputs.matrix) }}

    env:
      FLUTTER_VERSION: '3.41.0'
      # cargokit 使用 `rustup run stable cargo build`，须保证 stable ≥ easytier MSRV。
      NDK_VERSION: '28.2.13676358'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: ☕ Setup JDK (Android)
        if: matrix.flutter_platform == 'android'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        if: matrix.flutter_platform == 'android'
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            tools platform-tools platforms;android-35 build-tools;35.0.0 ndk;${{ env.NDK_VERSION }} cmake;3.22.1

      - name: 🔧 Setup bindgen for Android
        if: matrix.flutter_platform == 'android'
        run: |
          NDK_PATH=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}
          SYSROOT=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$SYSROOT" >> $GITHUB_ENV
          echo "✅ Configured bindgen for Android NDK"

      - name: 📦 Install Linux dependencies
        # Android 跑在 Ubuntu 上，但不需要 GTK/CJK 字体；整包 apt 曾卡死数小时。
        if: matrix.flutter_platform == 'linux'
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libgtk-3-dev \
            clang \
            cmake \
            pkg-config \
            libcurl4-openssl-dev \
            protobuf-compiler \
            libayatana-appindicator3-dev \
            libnotify-dev \
            fontconfig

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 🎯 Enable desktop platform
        if: matrix.flutter_platform == 'linux' || matrix.flutter_platform == 'windows'
        run: flutter config --enable-${{ matrix.flutter_platform }}-desktop

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # Windows 不能靠 Chocolatey；Android 跑在 Ubuntu 上也需要 protoc（cargokit/prost）。
      - name: 📥 Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: 🪟 Windows native build prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "CARGOKIT_VERBOSE=1"
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_BUILD_JOBS=2"
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name 'LongPathsEnabled' -Value 1 -PropertyType DWORD -Force | Out-Null
          $protoc = (Get-Command protoc).Source
          Add-Content -Path $env:GITHUB_ENV -Value "PROTOC=$protoc"
          Write-Host '--- toolchain ---'
          rustc -V
          rustup show
          Write-Host '--- protoc / nasm ---'
          & protoc --version
          & nasm -v

      - name: 📚 Get dependencies
        # git 包（astral_rust_core / vpn_service_plugin）始终跟远端 main tip，不钉 lock 里的旧 resolved-ref。
        run: flutter pub upgrade astral_rust_core vpn_service_plugin
        shell: bash

      # 只缓存 crates 源码（registry/git），不缓存 cargokit/target 编译产物。
      # 三端 target 会撑爆 GitHub 10GB 限额；key 换前缀以免 restore 到旧的大包。
      - name: 🧊 Cache cargo crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-crates-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            cargo-crates-${{ runner.os }}-

      - name: 🔐 Setup Android release signing
        if: matrix.flutter_platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # PR 可能无 secrets：回退 debug 签名，仅提示。
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "::warning::No ANDROID_KEYSTORE_BASE64 on PR; using debug signing"
              exit 0
            fi
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "::error::Missing Android signing secrets (PASSWORD / ALIAS)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          echo "✅ Android release keystore ready"
        shell: bash

      - name: ✅ Verify Windows runtime DLLs
        if: matrix.flutter_platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dlls=(dlls/*.dll)
          if [ ${#dlls[@]} -eq 0 ]; then
            echo "::error::dlls/*.dll missing (need wintun.dll, Packet.dll)"
            exit 1
          fi
          ls -la dlls/

      - name: 🛶 Build shared Mono injector
        if: matrix.flutter_platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path tools\raft_astral_net\dist\AstralRaftNet.dll)) {
            throw 'tools/raft_astral_net/dist/AstralRaftNet.dll missing'
          }
          if (-not (Test-Path tools\valheim_astral_net\dist\AstralValheimNet.dll)) {
            throw 'tools/valheim_astral_net/dist/AstralValheimNet.dll missing'
          }
          cargo build --release --manifest-path tools\mono_inject\Cargo.toml
          New-Item -ItemType Directory -Force -Path tools\mono_inject\bin | Out-Null
          Copy-Item tools\mono_inject\target\release\astral_mono_inject.exe `
            tools\mono_inject\bin\astral_mono_inject.exe -Force
          if (-not (Test-Path tools\smartdns\smartdns.exe)) {
            throw 'tools/smartdns/smartdns.exe missing'
          }
          if (-not (Test-Path tools\smartdns\smartdns.conf)) {
            throw 'tools/smartdns/smartdns.conf missing'
          }
          cargo build --release --manifest-path tools\auto_dns_binder\Cargo.toml
          New-Item -ItemType Directory -Force -Path tools\auto_dns_binder\bin | Out-Null
          Copy-Item tools\auto_dns_binder\target\release\auto_dns_binder.exe `
            tools\auto_dns_binder\bin\auto_dns_binder.exe -Force
          Get-Item tools\raft_astral_net\dist\AstralRaftNet.dll,
                   tools\valheim_astral_net\dist\AstralValheimNet.dll,
                   tools\mono_inject\bin\astral_mono_inject.exe,
                   tools\auto_dns_binder\bin\auto_dns_binder.exe,
                   tools\smartdns\smartdns.exe,
                   tools\smartdns\smartdns.conf

      - name: 🛠️ Build for ${{ matrix.platform }}
        run: ${{ matrix.build_cmd }}
        shell: bash

      - name: 📦 Package Linux app
        if: matrix.flutter_platform == 'linux' && matrix.package
        run: |
          mkdir -p release
          cd ${{ matrix.artifact_path }}
          tar -czf $GITHUB_WORKSPACE/release/${{ matrix.artifact_name }}.tar.gz *
        shell: bash

      - name: 📦 Compress Windows app
        if: matrix.flutter_platform == 'windows' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseDir = "release"
          $buildDir = "${{ matrix.artifact_path }}"
          $zipPath = Join-Path $releaseDir "${{ matrix.artifact_name }}.zip"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Compress-Archive -Path (Join-Path $buildDir "*") `
                          -DestinationPath $zipPath `
                          -Force
          Write-Host "✅ Created package: $zipPath"

      - name: 📜 App semver for installer (pubspec, no +build)
        if: matrix.flutter_platform == 'windows' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $line = Get-Content "pubspec.yaml" | Where-Object { $_ -match '^\s*version:\s*' } | Select-Object -First 1
          if (-not $line) { throw "version: not found in pubspec.yaml" }
          if ($line -match 'version:\s*([\d.]+)') {
            $v = $Matches[1]
          } else {
            throw "Could not parse version from: $line"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$v"
          Write-Host "Installer semver: $v"

      - name: 📦 Install Inno Setup
        if: matrix.flutter_platform == 'windows' && runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: 📦 Build Windows installer (Inno Setup)
        if: matrix.flutter_platform == 'windows' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          & $iscc "installer/astral_game.iss" "/DMyAppVersion=$env:APP_VERSION"

      - name: 📤 Upload Android APK
        if: matrix.flutter_platform == 'android'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 14

      - name: 📤 Upload Linux package
        if: matrix.flutter_platform == 'linux' && matrix.package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*.tar.gz
          retention-days: 14

      - name: 📤 Upload Windows package
        if: matrix.flutter_platform == 'windows' && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*.zip
          retention-days: 14

      - name: 📤 Upload Windows installer
        if: matrix.flutter_platform == 'windows' && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: astral-game-windows-x64-setup
          path: release_installer/astral-game-*-windows-x64-setup.exe
          retention-days: 14
