# 发布 Astral Game
#
# 自动：推送 v* 标签 → Build 三端编译成功 → 本工作流自动创建并发布 Release，
#       同时触发 AUR 推送（Release 附件对外可见后才推 AUR）。
# 手动：Actions → 发布 → Run workflow（指定 tag，复用该 tag 最近一次 Build 产物，
#       创建 draft Release，仍需手动 Publish）。
#
# Secret：
# - ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS
#   （Build 工作流正式签名 Android APK；PR 无密钥时回退 debug）
# - ASTRAL_SITE_TOKEN（repo 写权限 PAT：创建 Release；GITHUB_TOKEN 创建的 release
#   事件不会触发 AUR 工作流，因此自动流程会显式 workflow_dispatch 一次）
# 附件命名：astral-game-<semver>-<platform>-<arch>.<ext>

name: 发布

on:
  # Build 跑完之后接手；只有 v* 标签推送触发的成功编译才进入自动发布。
  workflow_run:
    workflows: ['🚀 Build Astral Game']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git 标签（如 v1.3.7）'
        required: true
        type: string

permissions:
  contents: write
  actions: write # 显式触发 AUR 工作流
  attestations: write

# 同一个 tag 串行发布；自动触发 + 手动重跑不会并发写同一个 Release。
concurrency:
  group: release-${{ github.event.workflow_run.head_branch || inputs.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cfg.outputs.version }}
      tag: ${{ steps.cfg.outputs.tag }}
      run_id: ${{ steps.cfg.outputs.run_id }}
      auto: ${{ steps.cfg.outputs.auto }}
    steps:
      - name: 检出
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || inputs.tag_name }}

      - name: 解析发布参数
        id: cfg
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_run" ]; then
            TAG="$RUN_TAG"
            RUN="$RUN_ID"
            SEARCH=false
            MISSING=fail
            DRAFT=false
            AUTO=true
          else
            TAG="$INPUT_TAG"
            RUN=""
            SEARCH=true
            MISSING=warn
            DRAFT=true
            AUTO=false
          fi
          if [ -z "$TAG" ]; then
            echo "::error::未解析到 tag"
            exit 1
          fi
          VER="${TAG#v}"

          {
            echo "tag=$TAG"
            echo "version=$VER"
            echo "target=main"
            echo "draft=$DRAFT"
            echo "prerelease=true"
            echo "run_id=$RUN"
            echo "search=$SEARCH"
            echo "missing=$MISSING"
            echo "auto=$AUTO"
          } >> "$GITHUB_OUTPUT"

          echo "PKG_VER=$VER" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"

      - name: 拉取 Windows zip
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.cfg.outputs.run_id }}
          workflow: build.yml
          name: astral-game-windows-x64
          path: _dl/windows
          search_artifacts: ${{ steps.cfg.outputs.search == 'true' }}
          if_no_artifact_found: ${{ steps.cfg.outputs.missing }}

      - name: 拉取 Linux
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.cfg.outputs.run_id }}
          workflow: build.yml
          name: astral-game-linux-x64
          path: _dl/linux
          search_artifacts: ${{ steps.cfg.outputs.search == 'true' }}
          if_no_artifact_found: ${{ steps.cfg.outputs.missing }}

      - name: 拉取 Android arm64
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.cfg.outputs.run_id }}
          workflow: build.yml
          name: astral-game-android-arm64
          path: _dl/android-arm64
          search_artifacts: ${{ steps.cfg.outputs.search == 'true' }}
          if_no_artifact_found: ${{ steps.cfg.outputs.missing }}

      - name: 拉取 Windows 安装包
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.cfg.outputs.run_id }}
          workflow: build.yml
          name: astral-game-windows-x64-setup
          path: _dl/installer
          search_artifacts: ${{ steps.cfg.outputs.search == 'true' }}
          if_no_artifact_found: ${{ steps.cfg.outputs.missing }}

      - name: 规范命名 release/
        env:
          PKG_VER: ${{ steps.cfg.outputs.version }}
        run: |
          set -euxo pipefail
          mkdir -p release
          pick() { find _dl -type f -name "$1" 2>/dev/null | head -1; }
          f=$(pick '*.zip'); [ -n "$f" ] && cp -f "$f" "release/astral-game-${PKG_VER}-windows-x64.zip"
          f=$(pick '*.tar.gz'); [ -n "$f" ] && cp -f "$f" "release/astral-game-${PKG_VER}-linux-x64.tar.gz"
          f=$(find _dl/android-arm64 -name '*.apk' 2>/dev/null | head -1); [ -n "$f" ] && cp -f "$f" "release/astral-game-${PKG_VER}-android-arm64.apk"
          f=$(find _dl/installer -name '*.exe' 2>/dev/null | head -1); [ -n "$f" ] && cp -f "$f" "release/astral-game-${PKG_VER}-windows-x64-setup.exe"
          ls -la release/ || true

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.ASTRAL_SITE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.cfg.outputs.tag }}
          TARGET: ${{ steps.cfg.outputs.target }}
          DRAFT: ${{ steps.cfg.outputs.draft }}
          PRE: ${{ steps.cfg.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ ! -d release ] || [ -z "$(ls -A release 2>/dev/null || true)" ]; then
            echo "release/ 为空，无法创建 Release" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过 create"
            exit 0
          fi
          echo "" > /tmp/release-body.md
          args=(release create "$TAG" --title "Astral Game $TAG" --notes-file /tmp/release-body.md --target "$TARGET")
          if [ "$DRAFT" = "true" ]; then args+=(--draft); fi
          if [ "$PRE" = "true" ]; then args+=(--prerelease); fi
          # shellcheck disable=SC2206
          files=(release/*)
          gh "${args[@]}" "${files[@]}"

      - name: 触发 AUR 发布
        if: steps.cfg.outputs.auto == 'true'
        env:
          GH_TOKEN: ${{ secrets.ASTRAL_SITE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.cfg.outputs.tag }}
        run: |
          set -euo pipefail
          # release.published 若由 GITHUB_TOKEN 触发不会再拉起工作流，这里显式派发；
          # aur.yml 自身有 concurrency + 幂等判断，重复触发时第二次直接跳过。
          gh workflow run aur.yml --repo "$GITHUB_REPOSITORY" -f tag_name="$TAG"

  # 顺带产出 Arch 包（.pkg.tar.zst）并挂到同一个 Release：
  # 玩家不装 AUR 也能一条命令装 —— pacman 原生支持 URL：
  #   sudo pacman -U https://github.com/.../releases/download/<tag>/astral-game-bin-<版本>-1-x86_64.pkg.tar.zst
  # makepkg 只有 Arch 环境有，且拒绝以 root 运行，所以跑在 Arch 容器里 + 普通用户。
  pkg:
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: ⚙️ 安装打包工具
        run: |
          pacman -Sy --noconfirm --needed --disable-download-timeout \
            base-devel git github-cli
          useradd -m builder

      - name: 📥 检出
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: 📥 拉取 Linux 产物
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.release.outputs.run_id }}
          workflow: build.yml
          name: astral-game-linux-x64
          path: _dl/linux
          search_artifacts: true
          if_no_artifact_found: fail

      - name: 📦 makepkg 出 Arch 包
        env:
          VER: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkg && cd /tmp/pkg
          cp "$GITHUB_WORKSPACE"/packaging/aur/PKGBUILD \
             "$GITHUB_WORKSPACE"/packaging/aur/astral-game-bin.install \
             "$GITHUB_WORKSPACE"/packaging/aur/fan.astral.next.game.desktop .

          # 产物已在手，放到 makepkg 认得的同名位置就不会再去下载
          # （此时 Release 若还是 draft，source URL 对外不可访问）；pkgver / sha256sums 按本次产物覆盖。
          cp "$GITHUB_WORKSPACE"/_dl/linux/astral-game-linux-x64.tar.gz \
             "astral-game-bin-$VER.tar.gz"
          SHA=$(sha256sum "astral-game-bin-$VER.tar.gz" | cut -d' ' -f1)
          sed -i "s|^pkgver=.*|pkgver=$VER|" PKGBUILD
          sed -i "s|^sha256sums=.*|sha256sums=('$SHA' 'SKIP')|" PKGBUILD

          chown -R builder /tmp/pkg
          runuser -u builder -- env HOME=/home/builder makepkg -f --nodeps
          ls -l /tmp/pkg/*.pkg.tar.zst

      - name: 📤 挂到 Release
        env:
          GH_TOKEN: ${{ secrets.ASTRAL_SITE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          # makepkg 默认还会产一个 -debug 子包，Release 不要它。
          PKG=$(ls /tmp/pkg/astral-game-bin-*.pkg.tar.zst | grep -v -- -debug- | head -1)
          echo "上传: $PKG"
          # 显式 -R：容器里以 root 跑，gh 靠 git 探测仓库会报 dubious ownership。
          gh release upload "$TAG" "$PKG" --clobber -R "$GITHUB_REPOSITORY"
