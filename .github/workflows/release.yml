# 发布 Astral Game
#
# 仅手动：Actions → 发布 → Run workflow。须先有对应 tag 的 Build 产物。
# 推送 v* 标签只会触发编译，不会创建 GitHub Release。
#
# Secret：
# - ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS
#   （Build 工作流正式签名 Android APK；PR 无密钥时回退 debug）
# - ASTRAL_SITE_TOKEN（repo 写权限 PAT：创建 Release）
# 附件命名：astral-game-<semver>-<platform>-<arch>.<ext>

name: 发布

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git 标签（如 v1.3.7）'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cfg.outputs.version }}
      tag: ${{ steps.cfg.outputs.tag }}
    steps:
      - name: 检出
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 解析发布参数
        id: cfg
        env:
          GH_TOKEN: ${{ secrets.ASTRAL_SITE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${{ inputs.tag_name }}"
          VER="${TAG#v}"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          {
            echo "tag=$TAG"
            echo "version=$VER"
            echo "target=main"
            echo "draft=true"
            echo "prerelease=true"
            echo "run_id="
            echo "search=true"
          } >> "$GITHUB_OUTPUT"

          echo "PKG_VER=$VER" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"

      - name: 拉取 Windows zip
        if: steps.cfg.outputs.skip != 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.cfg.outputs.run_id }}
          workflow: build.yml
          name: astral-game-windows-x64
          path: _dl/windows
          search_artifacts: ${{ steps.cfg.outputs.search == 'true' }}
          if_no_artifact_found: warn

      - name: 拉取 Linux
        if: steps.cfg.outputs.skip != 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.cfg.outputs.run_id }}
          workflow: build.yml
          name: astral-game-linux-x64
          path: _dl/linux
          search_artifacts: ${{ steps.cfg.outputs.search == 'true' }}
          if_no_artifact_found: warn

      - name: 拉取 Android arm64
        if: steps.cfg.outputs.skip != 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.cfg.outputs.run_id }}
          workflow: build.yml
          name: astral-game-android-arm64
          path: _dl/android-arm64
          search_artifacts: ${{ steps.cfg.outputs.search == 'true' }}
          if_no_artifact_found: warn

      - name: 拉取 Windows 安装包
        if: steps.cfg.outputs.skip != 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.cfg.outputs.run_id }}
          workflow: build.yml
          name: astral-game-windows-x64-setup
          path: _dl/installer
          search_artifacts: ${{ steps.cfg.outputs.search == 'true' }}
          if_no_artifact_found: warn

      - name: 规范命名 release/
        if: steps.cfg.outputs.skip != 'true'
        env:
          PKG_VER: ${{ steps.cfg.outputs.version }}
        run: |
          set -euxo pipefail
          mkdir -p release
          pick() { find _dl -type f -name "$1" 2>/dev/null | head -1; }
          f=$(pick '*.zip'); [ -n "$f" ] && cp -f "$f" "release/astral-game-${PKG_VER}-windows-x64.zip"
          f=$(pick '*.tar.gz'); [ -n "$f" ] && cp -f "$f" "release/astral-game-${PKG_VER}-linux-x64.tar.gz"
          f=$(find _dl/android-arm64 -name '*.apk' 2>/dev/null | head -1); [ -n "$f" ] && cp -f "$f" "release/astral-game-${PKG_VER}-android-arm64.apk"
          f=$(find _dl/installer -name '*.exe' 2>/dev/null | head -1); [ -n "$f" ] && cp -f "$f" "release/astral-game-${PKG_VER}-windows-x64-setup.exe"
          ls -la release/ || true

      - name: 创建 GitHub Release
        if: steps.cfg.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.ASTRAL_SITE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.cfg.outputs.tag }}
          TARGET: ${{ steps.cfg.outputs.target }}
          DRAFT: ${{ steps.cfg.outputs.draft }}
          PRE: ${{ steps.cfg.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ ! -d release ] || [ -z "$(ls -A release 2>/dev/null || true)" ]; then
            echo "release/ 为空，无法创建 Release" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过 create"
            exit 0
          fi
          echo "" > /tmp/release-body.md
          args=(release create "$TAG" --title "Astral Game $TAG" --notes-file /tmp/release-body.md --target "$TARGET")
          if [ "$DRAFT" = "true" ]; then args+=(--draft); fi
          if [ "$PRE" = "true" ]; then args+=(--prerelease); fi
          # shellcheck disable=SC2206
          files=(release/*)
          gh "${args[@]}" "${files[@]}"

  # 顺带产出 Arch 包（.pkg.tar.zst）并挂到同一个 Release：
  # 玩家不装 AUR 也能一条命令装 —— pacman 原生支持 URL：
  #   sudo pacman -U https://github.com/.../releases/download/<tag>/astral-game-bin-<版本>-1-x86_64.pkg.tar.zst
  # makepkg 只有 Arch 环境有，且拒绝以 root 运行，所以跑在 Arch 容器里 + 普通用户。
  pkg:
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: ⚙️ 安装打包工具
        run: |
          pacman -Sy --noconfirm --needed --disable-download-timeout \
            base-devel git github-cli
          useradd -m builder

      - name: 📥 检出
        uses: actions/checkout@v5

      - name: 📥 拉取 Linux 产物
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: astral-game-linux-x64
          path: _dl/linux
          search_artifacts: true
          if_no_artifact_found: fail

      - name: 📦 makepkg 出 Arch 包
        env:
          VER: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkg && cd /tmp/pkg
          cp "$GITHUB_WORKSPACE"/packaging/aur/PKGBUILD \
             "$GITHUB_WORKSPACE"/packaging/aur/astral-game-bin.install \
             "$GITHUB_WORKSPACE"/packaging/aur/fan.astral.next.game.desktop .

          # 产物已在手，放到 makepkg 认得的同名位置就不会再去下载
          # （此时 Release 还是 draft，source URL 对外不可访问）；pkgver / sha256sums 按本次产物覆盖。
          cp "$GITHUB_WORKSPACE"/_dl/linux/astral-game-linux-x64.tar.gz \
             "astral-game-bin-$VER.tar.gz"
          SHA=$(sha256sum "astral-game-bin-$VER.tar.gz" | cut -d' ' -f1)
          sed -i "s|^pkgver=.*|pkgver=$VER|" PKGBUILD
          sed -i "s|^sha256sums=.*|sha256sums=('$SHA' 'SKIP')|" PKGBUILD

          chown -R builder /tmp/pkg
          runuser -u builder -- env HOME=/home/builder makepkg -f --nodeps
          ls -l /tmp/pkg/*.pkg.tar.zst

      - name: 📤 挂到 Release
        env:
          GH_TOKEN: ${{ secrets.ASTRAL_SITE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" /tmp/pkg/astral-game-bin-*.pkg.tar.zst --clobber
