name: 游戏适配请求
description: 希望 Astral Game 支持某款游戏的联机（局域网发现、房间列表、直连等）
title: "[适配] "
labels: ["游戏适配"]
body:
  - type: markdown
    attributes:
      value: |
        已支持（Windows）：**Minecraft**、**Raft**、**Valheim**、**Supreme Commander: Forged Alliance**。

        请先搜一下有没有同名 Issue。适配取决于游戏怎么联机（局域网广播 / 组播 / 填 IP / Steam P2P），不是每款都能做。

  - type: input
    id: game_name
    attributes:
      label: 游戏名称
      description: 商店里的正式名。
      placeholder: 例如 Terraria、Palworld
    validations:
      required: true

  - type: input
    id: store_url
    attributes:
      label: 商店链接
      description: Steam / Epic / Xbox / 官网均可。
      placeholder: https://store.steampowered.com/app/……

  - type: input
    id: steam_app_id
    attributes:
      label: Steam App ID
      description: 可选。Steam 链接里 `/app/` 后面那串数字。
      placeholder: 239140

  - type: dropdown
    id: platforms
    attributes:
      label: 你在哪些平台玩
      multiple: true
      options:
        - Windows
        - Linux
        - Android
        - macOS
        - iOS
    validations:
      required: true

  - type: dropdown
    id: multiplayer
    attributes:
      label: 游戏现在怎么联机
      description: 可多选。不确定就选「不清楚」，并在下面补充。
      multiple: true
      options:
        - 局域网 / LAN（游戏内能搜到房间）
        - 自己当主机，别人填 IP
        - 独立服务器 / 专用服
        - Steam / Epic 好友联机（P2P）
        - 必须走官方在线服
        - 不清楚
    validations:
      required: true

  - type: dropdown
    id: expect
    attributes:
      label: 希望 Astral 做到哪一步
      multiple: true
      options:
        - 进同一 Astral 房间后，游戏局域网列表能看到对方
        - 进同一 Astral 房间后，用虚拟网 IP 直连
        - 客户端房间页能列出这款游戏的房间
        - 只要能联机就行，形式不限
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 现在的情况和问题
      description: 用 Astral 组网之后发生了什么？例如搜不到房间、能搜到进不去、只有直连可以。
      placeholder: |
        1. 双方都进了 Astral 房间
        2. 房主开了游戏局域网房
        3. 客人在游戏里搜不到 / 能看到但加不进去
    validations:
      required: true

  - type: dropdown
    id: can_test
    attributes:
      label: 是否愿意协助测试
      description: 适配完成后，能否帮忙验证联机是否正常。
      options:
        - 愿意，可以配合测试
        - 看情况
        - 不方便
    validations:
      required: true

  - type: input
    id: game_version
    attributes:
      label: 游戏版本
      description: 可选。例如正式版号、模组、整合包名。
      placeholder: 1.20.1 / 带某模组 / 无模组

  - type: input
    id: astral_version
    attributes:
      label: Astral Game 版本
      placeholder: 1.0.37

  - type: textarea
    id: extra
    attributes:
      label: 补充（端口、截图、资料）
      description: 可选。局域网端口、防火墙提示、游戏联机设置截图、Wiki 链接都可以。
